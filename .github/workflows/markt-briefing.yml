name: Markt-Briefing aktualisieren
on:
  schedule:
    # Morgens 06:45 deutscher Zeit. GitHub kennt nur UTC: Sommerzeit = 04:45 UTC, Winterzeit = 05:45 UTC.
    # Beide Zeiten sind eingetragen, der Schritt "Zeitfenster prüfen" lässt je nur den passenden Lauf durch.
    - cron: "45 4 * * 1-5"
    - cron: "45 5 * * 1-5"
    - cron: "30 21 * * 1-5"   # Abends nach US-Börsenschluss: Prognosen auswerten
  workflow_dispatch:
    inputs:
      mode:
        description: "morning = Briefing, evening = Abendauswertung"
        default: "morning"
        type: choice
        options: [morning, evening]
permissions:
  contents: write
concurrency:
  group: markt-briefing
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zeitfenster prüfen (nur geplante Läufe)
        id: gate
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          [ "${{ github.event_name }}" = "schedule" ] || exit 0
          [ "${{ github.event.schedule }}" = "30 21 * * 1-5" ] && exit 0
          H=$(TZ=Europe/Berlin date +%H%M)
          # nur zwischen 06:30 und 09:30 deutscher Zeit (GitHub verzögert Läufe gelegentlich)
          if [ "$H" -lt 0630 ] || [ "$H" -gt 0930 ]; then echo "Außerhalb des Fensters ($H) - übersprungen"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # schon ein Morgenlauf heute? (verhindert Doppellauf bei Sommer-/Winterzeit-Eintrag)
          TODAY=$(TZ=Europe/Berlin date +%F)
          GEN=$(python3 -c "import json;print(json.load(open('data/briefing.json'))['generated'])" 2>/dev/null || true)
          if [ -n "$GEN" ]; then
            GD=$(TZ=Europe/Berlin date -d "$GEN" +%F); GH=$(TZ=Europe/Berlin date -d "$GEN" +%H%M)
            if [ "$GD" = "$TODAY" ] && [ "$GH" -ge 0600 ]; then echo "Heute schon aktualisiert ($GH) - übersprungen"; echo "run=false" >> "$GITHUB_OUTPUT"; fi
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'
      - name: Daten holen und auswerten
        if: steps.gate.outputs.run == 'true'
        env:
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 21 * * 1-5" ] || [ "${{ inputs.mode }}" = "evening" ]; then
            python fetch_data.py --evening
          else
            python fetch_data.py
          fi
      - name: Commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "markt-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Briefing aktualisiert"
          git pull --rebase origin main
          git push
