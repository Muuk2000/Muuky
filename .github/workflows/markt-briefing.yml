name: Markt-Briefing aktualisieren
on:
  schedule:
    - cron: "15 5 * * 1-5"   # Mo-Fr 05:15 UTC = 07:15 Sommerzeit / 06:15 Winterzeit
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - run: python fetch_data.py
      - name: Commit
        run: |
          git config user.name "markt-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/briefing.json
          git diff --cached --quiet || git commit -m "Briefing aktualisiert" && git push
