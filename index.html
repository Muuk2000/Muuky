<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Markt-Briefing</title>
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#0f1720;--mute:#5d6b7a;--line:#e3e7ec;--up:#0a7d4f;--down:#c0392b;--acc:#1f5eff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#17212c;--ink:#eaf0f6;--mute:#93a1b0;--line:#26323f;--up:#3ddc97;--down:#ff6b5e;--acc:#6b9bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
header{padding:calc(16px + env(safe-area-inset-top)) 0 8px}
h1{font-size:1.35rem;margin:0}
.sub{color:var(--mute);font-size:.85rem}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0;position:sticky;top:0;background:var(--bg);scrollbar-width:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:.9rem}
nav button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.comment{color:var(--mute);font-size:.92rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.itm{border-top:1px solid var(--line)}.itm:first-child{border-top:0}.itm>.row{border-top:0;cursor:pointer}
.itm>.row .nm::after{content:' ▾';color:var(--mute);font-size:.75rem}.itm.open>.row .nm::after{content:' ▴'}
.detail{padding:4px 0 12px}.detail .kv{margin-top:6px}.detail p{margin:8px 0;font-size:.9rem}
.detail h3{font-size:.8rem;color:var(--mute);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.news a{display:block;color:var(--ink);text-decoration:none;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.news a span{display:block;color:var(--mute);font-size:.75rem}
.nm{font-weight:600}.sym{color:var(--mute);font-size:.78rem}
.num{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.tags{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:.74rem;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--ink);padding:2px 8px;border-radius:6px}
svg.sp{width:70px;height:26px;flex:none}
h2{font-size:1rem;margin:18px 0 4px}
.st{font-size:.74rem;padding:2px 8px;border-radius:6px;white-space:nowrap}
.st.frueh_rein{background:color-mix(in srgb,var(--up) 20%,transparent);color:var(--up)}
.st.frueh_raus{background:color-mix(in srgb,var(--down) 20%,transparent);color:var(--down)}
.st.fuehrend{border:1px solid var(--up);color:var(--up)}
.st.schwach{border:1px solid var(--down);color:var(--down)}
.st.neutral{border:1px solid var(--line);color:var(--mute)}
.note{color:var(--mute);font-size:.8rem;margin-top:8px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
.kv div{font-size:.82rem;color:var(--mute)}.kv b{display:block;color:var(--ink);font-size:1rem}
ul.why{margin:8px 0 0;padding-left:18px;color:var(--mute);font-size:.88rem}
.big{font-size:1.7rem;font-weight:700}
.warn{background:color-mix(in srgb,#e6a700 18%,transparent);border:1px solid #e6a700;border-radius:10px;padding:8px 12px;font-size:.85rem}
footer{color:var(--mute);font-size:.78rem;margin-top:20px}
</style>
</head>
<body>
<header><h1>Markt-Briefing</h1><div class="sub" id="stamp">lade …</div></header>
<nav id="tabs" aria-label="Bereiche"></nav>
<main id="main"></main>
<footer id="foot"></footer>
<script>
const fmt=(v,d=1)=>v==null?'–':(v>0?'+':'')+v.toFixed(d)+' %';
const cls=v=>v==null?'':v>0?'up':v<0?'down':'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function spark(a){if(!a||a.length<2)return'';const mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1;
 const p=a.map((v,i)=>`${(i/(a.length-1)*70).toFixed(1)},${(24-(v-mn)/r*22).toFixed(1)}`).join(' ');
 const c=a[a.length-1]>=a[0]?'var(--up)':'var(--down)';
 return `<svg class="sp" viewBox="0 0 70 26" aria-hidden="true"><polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.6"/></svg>`}
const ST={frueh_rein:'Frühsignal ↑',frueh_raus:'Frühwarnung ↓',fuehrend:'führend',schwach:'schwach',neutral:'neutral'};
function rot(){if(!D.rotation||!D.rotation.length)return'';
 return `<h2>Branchen-Rotation (Frühindikator)</h2><div class="card">`+D.rotation.map(r=>wrap(r.symbol,`<div class="row"><div><div class="nm">${esc(r.name)}</div>
  <div class="sym">${esc(r.group)} · rel. Stärke 5T ${fmt(r.rs5)} · 20T ${fmt(r.rs20)}</div></div>
  <span class="st ${r.state}">${ST[r.state]||''}</span></div>`)).join('')+
 `<div class="note">Relative Stärke = Branche gegenüber dem Weltmarkt (ACWI). „Frühsignal“: Branche holt auf, Kurs noch nicht bestätigt. „Frühwarnung“: Branche verliert relativ, Kurs hält noch. Hinweis, keine Prognose.</div></div>`}
const GS={'eskalierend':'frueh_raus','Anspannung steigt':'schwach','Entspannung':'frueh_rein','unverändert':'neutral'};
const BS={'klar bullisch':'frueh_rein','eher bullisch':'fuehrend','neutral':'neutral','eher bärisch':'schwach','klar bärisch':'frueh_raus'};
const stamp=x=>x?new Date(x).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'}):'';
function geoMini(){if(!G||!G.pairs)return'';
 return `<h2>Geopolitik-Lage</h2><div class="card">`+G.pairs.map(p=>`<div class="row"><div class="nm">${esc(p.pair)}</div><span class="st ${GS[p.state]||'neutral'}">${esc(p.state)}</span></div>`).join('')+`</div>`}
function geoView(){
 return `<div class="card"><div class="comment">Wie angespannt berichten englischsprachige Medien über das Länderpaar? Vergleich: letzte 3 Tage gegen die 27 Tage davor (Ton und Anteil von Konfliktbegriffen).</div></div>`+
 G.pairs.map(p=>`<div class="card"><div class="row" style="border:0;padding:0"><div><div class="nm">${esc(p.pair)}</div>
  <div class="sym">Ton ${p.tone_now} (30-Tage-Schnitt ${p.tone_base}) · ${p.tension_ratio==null?'Konflikt-Anteil: keine Daten':'Konflikt-Anteil '+p.tension_ratio+'× des Üblichen'}</div></div>
  <span class="st ${GS[p.state]||'neutral'}">${esc(p.state)}</span></div><div style="margin-top:8px">${spark(p.spark)}</div></div>`).join('')+
 (G.markets&&G.markets.length?`<h2>Marktreaktion heute</h2><div class="card">`+G.markets.map(m=>`<div class="row"><div class="nm">${esc(m.name)}</div><div class="num"><div class="${cls(m.d1)}">${fmt(m.d1)}</div><div class="sym">1M ${fmt(m.m1,0)}</div></div></div>`).join('')+`</div>`:'')+
 `<div class="note">${esc(G.note||'')} Stand ${stamp(G.generated)}.</div>`}
function btcView(){const b=B,f=b.fear_greed;
 return `<div class="card"><div class="row" style="border:0;padding:0"><div><div class="big">${b.price.toLocaleString('de-DE')} $</div>
  <div class="sym">Tag <span class="${cls(b.d1)}">${fmt(b.d1)}</span> · 7T <span class="${cls(b.d7)}">${fmt(b.d7,0)}</span> · 30T <span class="${cls(b.d30)}">${fmt(b.d30,0)}</span></div></div>
  <span class="st ${BS[b.state]||'neutral'}">${esc(b.state)}</span></div><div style="margin-top:8px">${spark(b.spark)}</div>
  <ul class="why">${(b.why||[]).map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>
  <div class="card"><div class="kv"><div>RSI (14)<b>${b.rsi}</b></div><div>Mayer-Multiple (Kurs/SMA200)<b>${b.mayer}</b></div>
  <div>vs. SMA50<b class="${cls(b.vs_sma50)}">${fmt(b.vs_sma50)}</b></div><div>vs. SMA200<b class="${cls(b.vs_sma200)}">${fmt(b.vs_sma200)}</b></div>
  <div>Abstand zum 1-Jahres-Hoch<b>${fmt(b.from_high)}</b></div><div>Schwankung 30T (p. a.)<b>${b.vol30} %</b></div>
  <div>Korrelation Nasdaq (30T)<b>${b.corr_nasdaq??'–'}</b></div><div>Fear &amp; Greed<b>${f?f.value+' · '+esc(f.label):'–'}</b></div></div>
  <div class="note">Regelbasiertes Punktesystem (${b.points>0?'+':''}${b.points} von ±4), keine Prognose und keine Anlageberatung. Stand ${stamp(b.generated)}.</div></div>`}
function rateLine(x){if(!x||!x.n)return null;const sig=Math.abs(x.edge)>x.ci;
 return `<div class="big">${x.rate} %</div><div class="sym">Trefferquote bei ${x.n} Prognosen (±${x.ci} Prozentpunkte)</div>
  <div class="sym">Zum Vergleich: stur immer „${x.base_up>=50?'steigt':'fällt'}“ träfe ${Math.max(x.base_up,100-x.base_up).toFixed(1)} %. Vorsprung <b class="${cls(x.edge)}">${x.edge>0?'+':''}${x.edge}</b> Punkte${sig?'':' – statistisch nicht von Zufall zu unterscheiden'}.</div>`}
function tbl(o){return o?Object.entries(o).map(([k,v])=>`<div class="row"><div>${esc(k)}</div><div class="num">${v.rate} % <span class="sym">(${v.n})</span></div></div>`).join(''):''}
function statsView(){const L=S.live,K=S.backtest;
 let h=`<div class="card"><div class="nm">Live (echte Prognosen)</div>`+(L&&L.n?rateLine(L)+`<div class="sym">Offen (Abend steht noch aus): ${S.live_offen}</div>`:`<div class="comment">Noch keine ausgewerteten Live-Prognosen. Das Skript schreibt die Prognosen morgens fest und wertet sie abends aus, die Zahlen füllen sich ab dem ersten Handelstag.${S.live_offen?` Offen: ${S.live_offen}.`:''}</div>`)+`</div>`;
 h+=`<div class="card"><div class="nm">Rückschau (letzte ~200 Handelstage)</div>${K&&K.n?rateLine(K)+`<div class="sym">Prognose bei ${K.abdeckung} % der Tage/Werte, sonst keine Richtung.</div>`:'<div class="comment">Keine Daten.</div>'}</div>`;
 if(K&&K.n){h+=`<h2>Rückschau nach Bereich</h2><div class="card">${tbl(K.by_group)}</div><h2>Rückschau nach Indikator (allein)</h2><div class="card">${tbl(K.by_component)}</div><h2>Nach Richtung</h2><div class="card">${tbl(K.by_direction)}</div>`}
 if(S.recent&&S.recent.length)h+=`<h2>Zuletzt ausgewertet</h2><div class="card">`+S.recent.map(r=>`<div class="row"><div><div class="nm">${esc(r.name)}</div><div class="sym">${esc(r.date)} · Prognose ${r.pred>0?'↑':'↓'}</div></div><div class="num"><div class="${cls(r.chg)}">${fmt(r.chg)}</div><div class="${r.hit?'up':'down'}">${r.hit?'✓ Treffer':'✗ daneben'}</div></div></div>`).join('')+`</div>`;
 return h+`<div class="note">${esc(S.method||'')}</div>`}
const GAS={'Preisdruck steigt':'frueh_raus','eher steigend':'schwach','neutral':'neutral','eher fallend':'fuehrend','Preisdruck lässt nach':'frueh_rein'};
function gasView(){const g=X,st=g.storage;
 return `<div class="card"><div class="row" style="border:0;padding:0"><div><div class="big">${g.price.toLocaleString('de-DE')} €/MWh</div>
  <div class="sym">TTF Front-Month · Tag <span class="${cls(g.d1)}">${fmt(g.d1)}</span> · 7T <span class="${cls(g.d7)}">${fmt(g.d7,0)}</span> · 30T <span class="${cls(g.d30)}">${fmt(g.d30,0)}</span></div></div>
  <span class="st ${GAS[g.state]||'neutral'}">${esc(g.state)}</span></div><div style="margin-top:8px">${spark(g.spark)}</div>
  <ul class="why">${(g.why||[]).map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>
  <div class="card"><div class="kv"><div>vs. SMA50<b class="${cls(g.vs_sma50)}">${fmt(g.vs_sma50)}</b></div><div>vs. SMA200<b class="${cls(g.vs_sma200)}">${fmt(g.vs_sma200)}</b></div>
  <div>RSI (14)<b>${g.rsi}</b></div><div>Position in 1-Jahres-Spanne<b>${g.range_pctile}. Perzentil</b></div>
  <div>1-Jahres-Tief / -Hoch<b>${g.low_1y} / ${g.high_1y}</b></div><div>Schwankung 30T (p. a.)<b>${g.vol30} %</b></div>
  ${g.premium_x?`<div>US-Gas (Henry Hub)<b>${g.henry_hub_eur_mwh} €/MWh</b></div><div>Europa-Aufschlag<b>${g.premium_x}×</b></div>`:''}
  ${st?`<div>Speicher EU gefüllt<b>${st.full} %</b></div><div>Gegenüber Vorjahr<b class="${st.vs_last_year>0?'up':'down'}">${st.vs_last_year>0?'+':''}${st.vs_last_year} Pkt.</b></div>`:'<div style="grid-column:1/-1">Speicherstand: nicht aktiv (benötigt kostenlosen GIE-API-Key als Secret <b>GIE_API_KEY</b>).</div>'}</div>
  <div class="note">Regelbasiertes Punktesystem (${g.points>0?'+':''}${g.points}), keine Prognose und keine Anlageberatung. Wetter (Heizbedarf) und LNG-Lieferungen sind nicht enthalten. Stand ${stamp(g.generated)}.</div></div>`}
let D,S,G,B,X,cur='Überblick';
const OPEN=new Set(),ITEMS={};
const RSL={frueh_rein:'Frühsignal: relative Stärke dreht nach oben, Kurs noch nicht bestätigt.',frueh_raus:'Frühwarnung: relative Stärke lässt nach, Kurs hält noch.',fuehrend:'Führend gegenüber dem Weltmarkt.',schwach:'Schwächer als der Weltmarkt.',neutral:'Relative Stärke unauffällig.'};
function explain(i){const p=[];
 if(i.trend==='auf')p.push('Der Kurs liegt über SMA50 und SMA200: der übergeordnete Trend ist intakt.');
 else if(i.trend==='ab')p.push('Der Kurs liegt unter SMA50 und SMA200: der übergeordnete Trend zeigt abwärts.');
 else if(i.trend)p.push('Der Kurs liegt zwischen den Durchschnitten: kein klarer Trend.');
 if(i.rsi>=70)p.push(`RSI ${i.rsi}: kurzfristig überkauft, Rücksetzer werden wahrscheinlicher, ein starker Trend kann aber überkauft bleiben.`);
 else if(i.rsi<=30)p.push(`RSI ${i.rsi}: kurzfristig überverkauft, eine Gegenbewegung ist möglich.`);
 if(i.from_high!=null){if(i.from_high>=-3)p.push('Nahe am 52-Wochen-Hoch.');else if(i.from_high<=-20)p.push(`Deutlich unter dem 52-Wochen-Hoch (${fmt(i.from_high,0)}).`)}
 if(i.rs_state&&RSL[i.rs_state])p.push(RSL[i.rs_state]);
 if(i.d1!=null&&i.m1!=null){if(i.d1>0&&i.m1<-5)p.push('Heute im Plus gegen einen schwachen Monatstrend: Erholung oder Fehlsignal.');if(i.d1<0&&i.m1>5)p.push('Heute im Minus im intakten Monatstrend: womöglich Gewinnmitnahmen.')}
 if(i.vol_ratio>=2)p.push(`Handelsvolumen ${i.vol_ratio}× über dem Schnitt: ungewöhnlich hohes Interesse.`);
 return p.join(' ')||'Keine Auffälligkeiten.'}
function bigspark(a){if(!a||a.length<2)return'';const mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1;
 const pts=a.map((v,k)=>`${(k/(a.length-1)*300).toFixed(1)},${(58-(v-mn)/r*52).toFixed(1)}`).join(' ');
 const c=a[a.length-1]>=a[0]?'var(--up)':'var(--down)';
 return `<svg viewBox="0 0 300 64" style="width:100%;height:64px" role="img" aria-label="Kursverlauf 30 Tage"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2"/></svg>
 <div class="sym" style="display:flex;justify-content:space-between"><span>30 Tage · Tief ${mn.toLocaleString('de-DE')}</span><span>Hoch ${mx.toLocaleString('de-DE')}</span></div>`}
function detail(i){const f=i.forecast;
 return `<div class="detail">${bigspark(i.spark)}<p>${esc(explain(i))}</p>
 <div class="kv"><div>Kurs<b>${i.price?.toLocaleString('de-DE')}</b></div><div>Heute<b class="${cls(i.d1)}">${fmt(i.d1)}</b></div>
 <div>5 Tage<b class="${cls(i.d5)}">${fmt(i.d5)}</b></div><div>1 Monat<b class="${cls(i.m1)}">${fmt(i.m1)}</b></div>
 <div>vs. SMA50<b class="${cls(i.vs_sma50)}">${fmt(i.vs_sma50)}</b></div><div>vs. SMA200<b class="${cls(i.vs_sma200)}">${fmt(i.vs_sma200)}</b></div>
 <div>RSI (14)<b>${i.rsi??'–'}</b></div><div>vom 52W-Hoch<b>${fmt(i.from_high)}</b></div>
 ${i.rs20!=null?`<div>Rel. Stärke 5T / 20T<b>${fmt(i.rs5)} / ${fmt(i.rs20)}</b></div>`:''}${i.vol_ratio?`<div>Volumen vs. Schnitt<b>${i.vol_ratio}×</b></div>`:''}
 <div>Prognose heute<b>${f?(f==='up'?'↑ steigt':'↓ fällt'):'keine Richtung'}</b></div></div>
 ${i.signals&&i.signals.length?`<h3>Signale</h3><ul class="why">${i.signals.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
 ${i.news&&i.news.length?`<h3>Aktuelle Schlagzeilen</h3><div class="news">${i.news.map(n=>`<a href="${esc(n.u)}" target="_blank" rel="noopener noreferrer">${esc(n.t)}<span>${esc(n.p)}${n.d?' · '+esc(n.d):''}</span></a>`).join('')}</div>`:'<h3>Schlagzeilen</h3><div class="sym">Zurzeit keine geladen.</div>'}</div>`}
function wrap(sym,inner){const it=ITEMS[sym];if(!it)return inner;const o=OPEN.has(sym);return `<div class="itm${o?' open':''}" data-s="${esc(sym)}">${inner}${o?detail(it):''}</div>`}
function row(i){return wrap(i.symbol,`<div class="row"><div><div class="nm">${esc(i.name)} <span class="sym">${esc(i.symbol)}</span>${i.forecast?`<span class="sym"> · Prognose ${i.forecast==='up'?'↑':'↓'}</span>`:''}</div>
 ${i.signals&&i.signals.length?`<div class="tags">${i.signals.slice(0,2).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>`:''}</div>
 ${spark(i.spark)}<div class="num"><div class="${cls(i.d1)}">${fmt(i.d1)}</div><div class="sym">RSI ${i.rsi??'–'} · 1M ${fmt(i.m1,0)}</div></div></div>`)}
function render(){
 const m=document.getElementById('main');
 if(cur==='Überblick'){
  m.innerHTML=(D.demo?'<div class="warn">Testdaten – keine echten Kurse.</div>':'')+
   `<h2>Top-Signale heute</h2><div class="card">${D.top_signals.length?D.top_signals.map(t=>wrap(t.symbol,`<div class="row"><div><div class="nm">${esc(t.name)} <span class="sym">${esc(t.group)}</span></div>
   <div class="tags">${t.signals.slice(0,3).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div></div><div class="num ${cls(t.d1)}">${fmt(t.d1)}</div></div>`)).join(''):'<div class="comment">Keine auffälligen Signale.</div>'}</div>`+
   rot()+geoMini()+`<h2>Lage je Bereich</h2>`+D.groups.map(g=>`<div class="card"><div class="comment">${esc(g.comment)}</div></div>`).join('');
 }else if(cur==='Geopolitik'){m.innerHTML=geoView()
 }else if(cur==='Erdgas EU'){m.innerHTML=gasView()
 }else if(cur==='Bitcoin'){m.innerHTML=btcView()
 }else if(cur==='Trefferquote'){m.innerHTML=statsView()
 }else{
  const g=D.groups.find(x=>x.name===cur);
  m.innerHTML=`<div class="card"><div class="comment">${esc(g.comment)}</div></div><div class="card">${g.items.map(row).join('')}</div>`;
 }
 document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===cur));
}
const J=u=>fetch(u,{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null);
document.getElementById('main').addEventListener('click',e=>{if(e.target.closest('a'))return;const it=e.target.closest('.itm[data-s]');if(!it)return;const k=it.dataset.s;OPEN.has(k)?OPEN.delete(k):OPEN.add(k);render()});
Promise.all([J('data/briefing.json'),J('data/stats.json'),J('data/geo.json'),J('data/btc.json'),J('data/gas.json')]).then(([d,s,g,b,x])=>{if(!d)throw 0;D=d;S=s;G=g;B=b;X=x;d.groups.forEach(g=>g.items.forEach(i=>ITEMS[i.symbol]=i));
 const names=['Überblick',...d.groups.map(g=>g.name),...(G&&G.pairs?['Geopolitik']:[]),...(X?['Erdgas EU']:[]),...(B?['Bitcoin']:[]),...(S?['Trefferquote']:[])];
 document.getElementById('tabs').innerHTML=names.map(n=>`<button data-t="${esc(n)}">${esc(n)}</button>`).join('');
 document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(b){cur=b.dataset.t;render();scrollTo(0,0)}};
 const t=new Date(d.generated);
